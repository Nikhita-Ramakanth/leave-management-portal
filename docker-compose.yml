services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: leaveuser
      POSTGRES_PASSWORD: leavepass
      POSTGRES_DB: leavedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaveuser -d leavedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://leaveuser:leavepass@db:5432/leavedb
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: