<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body>
    <h1>Create an Account</h1>

    <form method="POST">
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <label for="role">Role:</label><br>
        <select id="role" name="role">
            {% for r in roles %}
            <option value="{{ r }}">{{ r }}</option>
            {% endfor %}
        </select><br><br>

        <label for="practice">Practice:</label><br>
        <select id="practice" name="practice">
            <option value="">— Select Practice —</option>
            {% for p in practices %}
            <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
        </select><br><br>

        <label for="manager_id">Reports to:</label><br>
        <select id="manager_id" name="manager_id">
            <option value="">— None / Top of hierarchy —</option>
            {% for manager in managers %}
            <option value="{{ manager.id }}">{{ manager.name }} ({{ manager.role }})</option>
            {% endfor %}
        </select><br><br>

        <button type="submit">Register</button>
    </form>

    <br>
    <a href="/login">Already have an account? Login</a>
</body>
</html>
