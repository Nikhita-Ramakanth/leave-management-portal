{% extends "base.html" %}
{% block title %}Create account — Leavepoint{% endblock %}
{% block content %}

<div class="card" style="max-width: 460px; margin: 40px auto;">
    <h1>Create an account</h1>
    <p class="subtitle">Set up your profile to start requesting leave.</p>

    <form method="POST" id="registerForm">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Jordan Lee" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="name@company.com" required>

        <label>Phone number (optional)</label>
        <div style="display: flex; gap: 8px;">
            <select name="country_code" style="width: 110px; flex-shrink: 0;">
                <option value="+91" selected>🇮🇳 +91</option>
                <option value="+1">🇺🇸 +1</option>
                <option value="+44">🇬🇧 +44</option>
                <option value="+61">🇦🇺 +61</option>
                <option value="+971">🇦🇪 +971</option>
                <option value="+65">🇸🇬 +65</option>
            </select>
            <input type="tel" name="phone_number" placeholder="98765 43210" style="flex: 1;">
        </div>

        <label for="password">Password</label>
        <div style="position: relative;">
            <input type="password" id="password" name="password" placeholder="At least 8 characters" required style="padding-right: 44px;">
            <button type="button" onclick="togglePassword('password', this)" style="position: absolute; right: 6px; top: 5px; height: 30px; padding: 0 10px; background: transparent; color: var(--muted); border: none;">Show</button>
        </div>

        <label for="confirm_password">Confirm password</label>
        <div style="position: relative;">
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required style="padding-right: 44px;">
            <button type="button" onclick="togglePassword('confirm_password', this)" style="position: absolute; right: 6px; top: 5px; height: 30px; padding: 0 10px; background: transparent; color: var(--muted); border: none;">Show</button>
        </div>
        <p id="passwordMismatch" class="muted" style="color: var(--danger); display: none; margin-top: -12px;">Passwords don't match</p>

        <label for="role">Role</label>
        <select id="role" name="role">
            {% for r in roles %}
            <option value="{{ r }}">{{ r }}</option>
            {% endfor %}
        </select>

        <label for="practice">Practice</label>
        <select id="practice" name="practice" onchange="filterManagers()">
            <option value="">Select practice</option>
            {% for p in practices %}
            <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
        </select>

        <label for="manager_id">Reports to</label>
        <select id="manager_id" name="manager_id">
            <option value="">None / top of hierarchy</option>
            {% for manager in managers %}
            <option value="{{ manager.id }}" data-practice="{{ manager.practice }}">{{ manager.name }} ({{ manager.role }})</option>
            {% endfor %}
        </select>

        <button type="submit" style="width: 100%;">Create account</button>
    </form>

    <p class="muted" style="text-align: center; margin-top: 20px;">
        Already have an account? <a href="/login">Log in</a>
    </p>
</div>

<script>
    function filterManagers() {
        const selectedPractice = document.getElementById("practice").value;
        const managerOptions = document.getElementById("manager_id").options;
        for (let i = 0; i < managerOptions.length; i++) {
            const option = managerOptions[i];
            const optionPractice = option.getAttribute("data-practice");
            if (!optionPractice) {
                option.style.display = "";
            } else if (optionPractice === selectedPractice) {
                option.style.display = "";
            } else {
                option.style.display = "none";
            }
        }
        document.getElementById("manager_id").value = "";
    }

    function togglePassword(fieldId, btn) {
        const field = document.getElementById(fieldId);
        if (field.type === "password") {
            field.type = "text";
            btn.textContent = "Hide";
        } else {
            field.type = "password";
            btn.textContent = "Show";
        }
    }

    document.getElementById("registerForm").addEventListener("submit", function (e) {
        const pw = document.getElementById("password").value;
        const confirm = document.getElementById("confirm_password").value;
        const mismatchMsg = document.getElementById("passwordMismatch");
        if (pw !== confirm) {
            e.preventDefault();
            mismatchMsg.style.display = "block";
        } else {
            mismatchMsg.style.display = "none";
        }
    });
</script>

{% endblock %}
