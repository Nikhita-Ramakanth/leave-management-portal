{% extends "base.html" %}
{% block title %}Create Organization — Leavepoint{% endblock %}
{% block content %}

<div class="card" style="max-width: 520px; margin: 40px auto;">
    <h1>Create organization</h1>
    <p class="subtitle">Only the name is required — everything else can be added later.</p>

    <form method="POST">
        <label for="name">Organization name</label>
        <input type="text" id="name" name="name" placeholder="Acme Corp" required>

        <label for="industry">Industry</label>
        <input type="text" id="industry" name="industry" placeholder="Healthcare">

        <label for="contact_email">Contact email</label>
        <input type="email" id="contact_email" name="contact_email" placeholder="ops@acmecorp.com">

        <label for="contact_phone">Contact phone</label>
        <input type="text" id="contact_phone" name="contact_phone" placeholder="+91 98765 43210">

        <label for="address">Address</label>
        <input type="text" id="address" name="address" placeholder="123 Business Park, Hyderabad">

        <label for="website">Website</label>
        <input type="text" id="website" name="website" placeholder="acmecorp.com">

        <label for="employee_count">Employee count</label>
        <input type="number" id="employee_count" name="employee_count" placeholder="50">

        <label for="subscription_type">Subscription type</label>
        <select id="subscription_type" name="subscription_type">
            <option value="">Select...</option>
            <option value="Monthly">Monthly</option>
            <option value="Quarterly">Quarterly</option>
            <option value="Annually">Annually</option>
        </select>

        <label for="subscription_status">Subscription status</label>
        <select id="subscription_status" name="subscription_status">
            <option value="">Select...</option>
            <option value="Trial">Trial</option>
            <option value="Active">Active</option>
            <option value="Past Due">Past Due</option>
            <option value="Cancelled">Cancelled</option>
        </select>

        <button type="submit" style="width: 100%;">Create organization</button>
    </form>
</div>

{% endblock %}
