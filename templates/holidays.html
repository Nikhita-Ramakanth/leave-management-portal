{% extends "base.html" %}
{% block title %}Holidays — Leavepoint{% endblock %}
{% block content %}

<div class="card" style="max-width: 480px;">
    <h1>Add a holiday</h1>
    <form method="POST">
        <label for="date">Date</label>
        <input type="date" id="date" name="date" required>

        <label for="name">Holiday name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Independence Day" required>

        <button type="submit" style="width: 100%;">Add holiday</button>
    </form>
</div>

<div class="card">
    <h1>Company holidays</h1>
    {% if holidays %}
    <table>
        <tr>
            <th>Date</th>
            <th>Holiday</th>
        </tr>
        {% for h in holidays %}
        <tr>
            <td style="width: 140px;">{{ h.date }}</td>
            <td>{{ h.name }}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p class="muted">No holidays added yet.</p>
    {% endif %}
</div>

{% endblock %}
