<!DOCTYPE html>
<html>
<head>
    <title>Leave Management Portal</title>
</head>
<body>
    <h1>Leave Management Portal</h1>
    <p>Welcome! This portal helps manage employee leave requests.</p>

    <nav>
        <a href="/">Home</a> |
        <a href="/apply">Apply for Leave</a>
        <a href="/requests">View All Requests</a>
        {% if current_user.is_authenticated %}
        Welcome, {{ current_user.name }} ({{ current_user.role }}) |
        <a href="/logout">Logout</a>
    {% else %}
        <a href="/login">Login</a> |
        <a href="/register">Register</a>
    {% endif %}
    </nav>
</body>
</html>
