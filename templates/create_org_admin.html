{% extends "base.html" %}
{% block title %}Add Organization Admin — Leavepoint{% endblock %}
{% block content %}

<div class="card" style="max-width: 420px; margin: 40px auto;">
    <h1>Add organization admin</h1>
    <p class="subtitle">This creates the first Admin account for an organization.</p>

    <form method="POST">
        <label for="organization_id">Organization</label>
        <select id="organization_id" name="organization_id" required>
            <option value="">Select an organization...</option>
            {% for org in organizations %}
            <option value="{{ org.id }}">{{ org.name }}</option>
            {% endfor %}
        </select>

        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Jane Doe" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="jane@acmecorp.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>

        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>

        <button type="submit" style="width: 100%;">Create admin</button>
    </form>
</div>

{% endblock %}
