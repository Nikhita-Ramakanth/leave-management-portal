{% extends "base.html" %}
{% block title %}Invite Employee — Leavepoint{% endblock %}
{% block content %}

<div class="card" style="max-width: 460px; margin: 40px auto;">
    <h1>Invite an employee</h1>
    <p class="subtitle">Set up their account details. They'll only need to set a password.</p>

    <form method="POST">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Jordan Lee" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="name@company.com" required>

        <label for="org_role_id">Role</label>
        <select id="org_role_id" name="org_role_id" required onchange="filterManagers()">
            <option value="">Select a role...</option>
            {% for role in org_roles %}
            <option value="{{ role.id }}" data-level="{{ role.level }}">{{ role.title }}</option>
            {% endfor %}
        </select>

        <label for="org_practice_id">Department</label>
        <select id="org_practice_id" name="org_practice_id" onchange="filterManagers()">
            <option value="">None</option>
            {% for practice in org_practices %}
            <option value="{{ practice.id }}">{{ practice.name }}</option>
            {% endfor %}
        </select>

        <label for="manager_id">Reports to</label>
        <select id="manager_id" name="manager_id">
            <option value="">None / top of hierarchy</option>
            {% for manager in managers %}
            <option value="{{ manager.id }}" data-practice-id="{{ manager.org_practice_id or '' }}" data-level="{{ manager.org_role.level if manager.org_role else 999 }}">{{ manager.name }} ({{ manager.org_role.title if manager.org_role else 'Admin' }})</option>
            {% endfor %}
        </select>

        <button type="submit" style="width: 100%;">Generate invite link</button>
    </form>
</div>

<script>
    function filterManagers() {
        const selectedPracticeId = document.getElementById("org_practice_id").value;
        const roleSelect = document.getElementById("org_role_id");
        const selectedRoleOption = roleSelect.options[roleSelect.selectedIndex];
        const selectedRoleLevel = selectedRoleOption ? parseInt(selectedRoleOption.getAttribute("data-level")) : null;

        const managerOptions = document.getElementById("manager_id").options;
        for (let i = 0; i < managerOptions.length; i++) {
            const option = managerOptions[i];
            const optionPracticeId = option.getAttribute("data-practice-id");
            const optionLevel = parseInt(option.getAttribute("data-level"));

            const practiceMatches = !optionPracticeId || optionPracticeId === selectedPracticeId;
            const levelMatches = !selectedRoleLevel || isNaN(optionLevel) || optionLevel > selectedRoleLevel;

            if (option.value === "" || (practiceMatches && levelMatches)) {
                option.style.display = "";
            } else {
                option.style.display = "none";
            }
        }
        document.getElementById("manager_id").value = "";
    }
</script>

{% endblock %}
